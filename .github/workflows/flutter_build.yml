name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Clean Flutter cache
        run: flutter clean && flutter pub cache clean --force

      - name: Clear Gradle cache
        run: rm -rf ~/.gradle/caches

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (with retry)
        run: |
          for i in {1..3}; do
            echo "Build attempt $i..."
            flutter build apk --release --no-shrink && exit 0
            if [ $i -lt 3 ]; then
              echo "Build failed, waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          exit 1

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
