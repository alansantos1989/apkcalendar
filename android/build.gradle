allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url 'https://central.maven.org/maven2' }
    }
}

subprojects {
    configurations.all {
        resolutionStrategy {
            // Force Kotlin 1.7.20 for all dependencies
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.7.20'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.20'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.20'
            force 'org.jetbrains.kotlin:kotlin-reflect:1.7.20'
            force 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.20'
        }
    }
}

ext {
    kotlin_version = '1.7.20'
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
